# Razorpay: build the hardened Spark Operator image from source and push it to Harbor (c.rzp.io).
#
# Self-contained: uses only public docker/* actions (no internal razorpay action), so the only
# prerequisite is that this repo can read the Harbor secrets. It builds the controller image from
# THIS repo's Dockerfile — rebuilding the operator Go binary with the bumped go.mod (0 Go CVEs),
# FROM the Harbor-approved apache/spark:4.2.1 mirror, with the Spark base hardened (apt upgrade,
# patched jar swaps, gosu removed) — then pushes a multi-arch manifest. The resulting image is
# whitelisted in rzp-docker-image-inventory as a custom base image.
#
# Requires repo (or inherited org) secrets HARBOR_DOCKER_USERNAME / HARBOR_DOCKER_PASSWORD
# (Harbor robot account with push rights to razorpay/spark-operator).

name: Razorpay Image Build and Push

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push to Harbor (otherwise build-only).
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'feature/razorpay-**'

permissions:
  contents: read

env:
  REGISTRY: c.rzp.io
  # Full image path under the Harbor `razorpay` project.
  IMAGE: c.rzp.io/razorpay/spark-operator
  # Operator version this image ships; bump with the release. HARDEN_REV tracks the Razorpay
  # hardening revision independently of the operator version.
  OP_VERSION: "2.6.0"
  HARDEN_REV: "hardened-v1"

jobs:
  build:
    name: Build and push controller (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tag
        id: tag
        run: |
          set -eux
          BASE="controller-${OP_VERSION}-${HARDEN_REV}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAG="${BASE}"
          else
            TAG="${BASE}-${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}:${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          # Harbor does not accept the OCI provenance/SBOM attestation manifest by default; keep a
          # plain multi-arch image manifest.
          provenance: false
