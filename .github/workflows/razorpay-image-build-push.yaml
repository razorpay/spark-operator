# Razorpay: build the hardened Spark Operator image from source and push it to Harbor (c.rzp.io).
#
# This is separate from the upstream build-and-push-images.yaml (which targets ghcr.io). It builds
# the controller image from THIS repo's Dockerfile — rebuilding the operator Go binary with the
# bumped go.mod (0 Go CVEs), FROM the Harbor-approved apache/spark:4.2.1 mirror, with the Spark
# base hardened (apt upgrade, patched jar swaps, gosu removed). The resulting image is then
# whitelisted in rzp-docker-image-inventory as a custom base image.
#
# Requires repo secrets HARBOR_DOCKER_USERNAME / HARBOR_DOCKER_PASSWORD (Harbor robot account).

name: Razorpay Image Build and Push

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push to Harbor (otherwise build-only).
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'feature/razorpay-**'

permissions:
  contents: read

env:
  REGISTRY: c.rzp.io
  REPOSITORY: spark-operator
  # Operator version this image ships; bump with the release. HARDEN_REV tracks the Razorpay
  # hardening revision independently of the operator version.
  OP_VERSION: "2.6.0"
  HARDEN_REV: "hardened-v1"

jobs:
  build:
    name: Build controller (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-amd64
          - linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tag
        id: tag
        run: |
          set -eux
          BASE="controller-${OP_VERSION}-${HARDEN_REV}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAG="${BASE}"
          else
            TAG="${BASE}-${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${REGISTRY}/razorpay/${REPOSITORY}:${TAG}-${{ matrix.platform }}"

      - name: Build and push (${{ matrix.platform }})
        # Pinned to the internal action's v1 branch HEAD (same pin datahub uses) so a repointed
        # branch cannot change this build silently.
        uses: razorpay/docker-image-build-push@149c7e92cf1a93d19239cff57a8fc3a61c48ed5e
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.REPOSITORY }}
          context: .
          file: Dockerfile
          custom-tag: ${{ steps.tag.outputs.tag }}-${{ matrix.platform }}
          enable-login: true
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

  manifest:
    name: Multi-arch manifest
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.push
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag
        id: tag
        run: |
          set -eux
          BASE="controller-${OP_VERSION}-${HARDEN_REV}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then TAG="${BASE}"; else TAG="${BASE}-${GITHUB_SHA}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        run: echo "${{ secrets.HARBOR_DOCKER_PASSWORD }}" | docker login "${REGISTRY}" -u "${{ secrets.HARBOR_DOCKER_USERNAME }}" --password-stdin

      - name: Create and push manifest
        run: |
          set -eux
          IMG="${REGISTRY}/razorpay/${REPOSITORY}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker manifest create "${IMG}:${TAG}" \
            "${IMG}:${TAG}-linux-amd64" \
            "${IMG}:${TAG}-linux-arm64"
          docker manifest push "${IMG}:${TAG}"
          echo "Published multi-arch: ${IMG}:${TAG}"
